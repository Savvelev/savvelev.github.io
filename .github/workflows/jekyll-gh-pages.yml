name: CI/CD Jekyll → GitHub Pages

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read         # для checkout
  pages: write           # для deploy-pages
  id-token: write        # для configure-pages

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4               # 🔄 заменили v3→v4

      - name: Enable Pages environment
        uses: actions/configure-pages@v5        # 🔄 v5 актуальна

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1     # без изменений
        with:
          source: ./
          destination: ./_site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3  # 🔄 v3 — использует v4 артефакты под капотом
        with:
          path: ./_site                         # путь к собранному сайту
          # name: github-pages                 # не обязательно — по умолчанию github-pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4           # 🔄 обновили v2→v4
