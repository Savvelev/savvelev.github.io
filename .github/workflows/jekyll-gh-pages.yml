# Sample workflow for building and deploying a Jekyll site to GitHub Pages
name: Deploy Jekyll with GitHub Pages dependencies preinstalled

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4  # 🔄 обновлено с v3 до v4

      - name: Setup Pages
        uses: actions/configure-pages@v4  # 🔄 обновлено с v3 до v4

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1  # ✅ без изменений
        with:
          source: ./
          destination: ./_site

      - name: Upload artifact manually
        uses: actions/upload-artifact@v4  # ✅ правильная замена
        with:
          name: github-pages  # ⚠️ важно: должно быть ИМЕННО `github-pages`
          path: ./_site        # путь к сгенерированному сайту

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v2  # ✅ без изменений
