name: Build & Deploy Jekyll → GitHub Pages

on:
  push:
    branches: ["main"]        # деплой только из main
  workflow_dispatch:          # запуск вручную

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5     # последняя на 2025-05

      - name: Build site with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: .
          destination: ./_site

      - name: Проверяем, что _site не пуст
        run: ls -R ./_site | head

      - name: Upload artifact для Pages
        uses: actions/upload-pages-artifact@v3   # ← ключевой шаг!
        with:
          path: ./_site                          # что паковать
          # name остаётся github-pages по умолчанию

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
        # artifact_name указывать не нужно: по умолчанию github-pages
