name: Build & Deploy Jekyll to GitHub Pages

on:
  push:
    branches: ["main"]      # деплой ТОЛЬКО из main
  workflow_dispatch:        # запуск вручную, если нужно

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5    # v5 актуальна

      - name: Build site with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: .
          destination: ./_site

      - name: Ensure _site is not empty   # ⬅ отладочный вывод, оставь
        run: ls -R ./_site | head

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: github-pages          # 👈 ОБЯЗАТЕЛЬНО!
          path: ./_site               # 👈 куда Jekyll вывел сайт
          if-no-files-found: error

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4     # v4 ищет артефакт
        with:
          artifact_name: github-pages     # 👈 то же имя
