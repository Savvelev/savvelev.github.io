name: CI/CD Jekyll → GitHub Pages

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # --- СБОРКА ---
  build:
    runs-on: ubuntu-latest
    outputs:
      artifact-name: github-pages
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      - name: Verify ./_site contents
        run: |
          ls -la ./_site

      - name: Upload artifact manually
        uses: actions/upload-artifact@v4
        with:
          name: github-pages       # ← ИМЯ артефакта должно совпадать с deploy
          path: ./_site

  # --- ДЕПЛОЙ ---
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v2
        with:
          artifact_name: ${{ needs.build.outputs.artifact-name }}
